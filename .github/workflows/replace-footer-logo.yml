name: Standardize Mavie Logo Markup And Styles

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standardize-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Standardize logo markup and CSS
        run: python3 scripts/standardize-logo.py

      - name: Commit logo changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.css'
          if git diff --cached --quiet; then
            echo "No logo changes needed."
          else
            git commit -m "Apply Mavie logo styles to all pages"
            git push
          fi
