name: Replace Footer Logo On All Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-footer-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace footer SVG logo with PNG logo on every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          replacement = '''<img src="Images/mavie-logo.png" alt="Mavie Jewelry" class="mavie-logo-image" style="
              width: 100%;
              height: auto;
            ">'''

          pattern = re.compile(
              r'(<div\s+class=["\']mavie-footer-logo-box["\'][\s\S]*?<a\b[^>]*>\s*)'
              r'<svg\b(?=[^>]*\bclass=["\']mavie-footer-logo["\'])[^>]*>[\s\S]*?</svg>'
              r'(\s*</a>)',
              re.IGNORECASE
          )

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn(r'\1' + replacement + r'\2', text, count=1)
              if count:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit footer logo changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No footer logo changes needed."
          else
            git commit -m "Replace footer logo across all pages"
            git push
          fi
