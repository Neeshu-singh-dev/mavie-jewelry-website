name: Standardize Mavie Logo Markup And Styles

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  standardize-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Standardize header and footer logo markup on every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          # Header logo: remove the inline sizing/layout styles from the link and image.
          header_pattern = re.compile(
              r'<a\b(?=[^>]*\bclass=["\']mavie-logo-link["\'])[^>]*\bhref=["\']index\.html["\'][^>]*>\s*'
              r'<img\b(?=[^>]*\bsrc=["\']Images/mavie-logo\.png["\'])[^>]*\bclass=["\']mavie-logo-image["\'][^>]*>\s*'
              r'</a>',
              re.IGNORECASE
          )

          header_replacement = '''<a href="index.html" class="mavie-logo-link" aria-label="Mavie Jewelry home">
            <img src="Images/mavie-logo.png" alt="Mavie Jewelry" class="mavie-logo-image">
          </a>'''

          # Footer logo: remove inline image sizing styles and keep the standardized footer link.
          footer_pattern = re.compile(
              r'<a\b(?=[^>]*\bclass=["\']mavie-logo-footer-link["\'])[^>]*\bhref=["\']index\.html["\'][^>]*>\s*'
              r'<img\b(?=[^>]*\bsrc=["\']Images/mavie-logo\.png["\'])[^>]*\bclass=["\']mavie-logo-image["\'][^>]*>\s*'
              r'</a>',
              re.IGNORECASE
          )

          footer_replacement = '''<a href="index.html" class="mavie-logo-footer-link">
            <img src="Images/mavie-logo.png" alt="Mavie Jewelry" class="mavie-logo-image">
          </a>'''

          # Also convert any older footer PNG link variants to the standardized footer class/href.
          old_footer_pattern = re.compile(
              r'<a\b[^>]*>\s*'
              r'<img\b(?=[^>]*\bsrc=["\']Images/mavie-logo\.png["\'])[^>]*\bclass=["\']mavie-logo-image["\'][^>]*>\s*'
              r'</a>',
              re.IGNORECASE
          )

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              text, header_count = header_pattern.subn(header_replacement, text)
              text, footer_count = footer_pattern.subn(footer_replacement, text)

              # Only normalize old footer anchors inside the footer-logo box.
              box_pattern = re.compile(
                  r'(<div\s+class=["\']mavie-footer-logo-box["\'][^>]*>)([\s\S]*?)(</div>)',
                  re.IGNORECASE
              )

              def normalize_footer_box(match):
                  box = match.group(0)
                  normalized, count = old_footer_pattern.subn(footer_replacement, box)
                  return normalized

              text, old_footer_count = box_pattern.subn(normalize_footer_box, text)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit logo markup changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No logo markup changes needed."
          else
            git commit -m "Standardize header and footer logo markup"
            git push
          fi
