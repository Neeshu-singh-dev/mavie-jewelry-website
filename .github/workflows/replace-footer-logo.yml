name: Standardize Mavie Logo Markup And Styles

on: [push]

jobs:
  standardize-logo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Standardize all HTML logo containers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          header = '''<div class="top-head-logo-box">
              <a href="index.html" class="mavie-logo-link" aria-label="Mavie Jewelry home">
                <img src="Images/mavie-logo.png" alt="Mavie Jewelry" class="mavie-logo-image">
              </a>
            </div>'''

          footer = '''<div class="mavie-footer-logo-box">
              <a href="index.html" class="mavie-logo-footer-link">
                <img src="Images/mavie-logo.png" alt="Mavie Jewelry" class="mavie-logo-image">
              </a>
            </div>'''

          header_box = re.compile(r'<div\b[^>]*class=["\'][^"\']*\btop-head-logo-box\b[^"\']*["\'][^>]*>[\s\S]*?</div>', re.I)
          footer_box = re.compile(r'<div\b[^>]*class=["\'][^"\']*\bmavie-footer-logo-box\b[^"\']*["\'][^>]*>[\s\S]*?</div>', re.I)

          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              text = header_box.sub(header, text)
              text = footer_box.sub(footer, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Changed pages:', changed)
          PY

      - name: Ensure centralized logo CSS
        run: |
          cat >> style.css <<'EOF'

/* Mavie header logo */
.mavie-logo-link {
  width: 180px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.mavie-logo-link img {
  width: 100%;
  height: auto;
}

@media screen and (max-width: 768px) {
  .mavie-logo-link {
    width: 110px;
  }
}

/* Mavie footer logo */
.mavie-logo-footer-link {
  width: 140px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.mavie-logo-footer-link img {
  width: 100%;
  height: auto;
}
EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' style.css
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Standardize logos across all pages"
            git push
          fi
