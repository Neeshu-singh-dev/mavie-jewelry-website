name: Replace Footer Logo On All Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-footer-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize footer logo on every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          # Replace the old inline SVG logo, if any, with the PNG logo.
          svg_pattern = re.compile(
              r'(<div\s+class=["\']mavie-footer-logo-box["\'][\s\S]*?<a\b[^>]*>\s*)'
              r'<svg\b(?=[^>]*\bclass=["\']mavie-footer-logo["\'])[^>]*>[\s\S]*?</svg>'
              r'(\s*</a>)',
              re.IGNORECASE
          )

          png_replacement = '''<img src="Images/mavie-logo.png" alt="Mavie Jewelry" class="mavie-logo-image" style="
              width: 100%;
              height: auto;
            ">'''

          # Normalize both existing PNG footer-logo links:
          # href="#" and href="index.html" become href="index.html"
          # and both receive class="mavie-logo-footer-link".
          png_link_pattern = re.compile(
              r'(<div\s+class=["\']mavie-footer-logo-box["\']\s*>\s*)'
              r'<a\b[^>]*>\s*'
              r'(<img\b[^>]*\bsrc=["\']Images/mavie-logo\.png["\'][^>]*>\s*)'
              r'(</a>)',
              re.IGNORECASE
          )

          png_link_replacement = r'\1<a href="index.html" class="mavie-logo-footer-link">\n          \2        \3'

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8')

              new_text, svg_count = svg_pattern.subn(
                  r'\1' + png_replacement + r'\2',
                  text
              )

              new_text, link_count = png_link_pattern.subn(
                  png_link_replacement,
                  new_text
              )

              if svg_count or link_count:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(f'{path} (svg={svg_count}, links={link_count})')

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit footer logo changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No footer logo changes needed."
          else
            git commit -m "Normalize footer logo link across all pages"
            git push
          fi
