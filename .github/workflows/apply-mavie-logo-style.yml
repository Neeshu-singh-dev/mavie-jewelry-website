name: Apply Mavie Logo Header Styling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  style-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply logo sizing to all HTML pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacement = '''<a href="index.html" class="mavie-logo-link" aria-label="Mavie Jewelry home" style="
            width: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
          ">
            <img src="Images/mavie-logo.png" alt="Mavie Jewelry" class="mavie-logo-image" style="
              width: 100%;
              height: auto;
            ">
          </a>'''

          pattern = re.compile(
              r'<a href="index\.html" class="mavie-logo-link" aria-label="Mavie Jewelry home"[^>]*>\s*'
              r'<img src="Images/mavie-logo\.png" alt="Mavie Jewelry" class="mavie-logo-image"[^>]*>\s*'
              r'</a>'
          )

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new_text, count = pattern.subn(replacement, text)
              if count:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(path.name)
          print('Updated:', ', '.join(changed))
          PY

      - name: Commit HTML logo styling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "Style Mavie PNG logo in header"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          rm -f .github/workflows/apply-mavie-logo-style.yml
          git add .github/workflows/apply-mavie-logo-style.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove temporary logo styling workflow"
          git push
